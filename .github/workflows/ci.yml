name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install public CI dependencies
      run: |
        python -m pip install --upgrade pip
        # requirements.lock.txt contains the private satellite_trade Git URL.
        # Keep CI reproducible without requiring a developer token in GitHub Actions.
        grep -v 'bloomb_mini.git' requirements.lock.txt > /tmp/requirements-ci.txt
        pip install -r /tmp/requirements-ci.txt
        pip install ruff mypy pytest pybind11
    - name: Build C++ extensions
      working-directory: nexus/cpp_extensions
      run: python setup.py build_ext --inplace
    - name: Lint with ruff
      run: ruff check nexus
    - name: Type check with mypy
      run: mypy nexus
    - name: Run tests
      run: pytest
